name: OPSFORGE Build Lab integrity checks

on:
  push:
    paths:
      - "build-lab/**"
      - ".streamlit/**"
      - ".github/workflows/build-lab-tests.yml"
  pull_request:
    paths:
      - "build-lab/**"
      - ".streamlit/**"
      - ".github/workflows/build-lab-tests.yml"
  workflow_dispatch:

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Build Lab integrity tests
        run: python -m unittest discover -s build-lab/tests -v
